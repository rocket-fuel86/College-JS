<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Мини-игра</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #player {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            left: 100px;
            top: 100px;
        }

        #target {
            width: 40px;
            height: 40px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
        }

        #message {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div id="player"></div>
    <div id="target"></div>
    <div id="message"></div>

    <script>
        const player = document.getElementById("player");
        const target = document.getElementById("target");
        const message = document.getElementById("message");

        let x = 100;
        let y = 100;
        const step = 20;

        let score = 0;

        message.textContent = score;

        // Случайное положение круга
        function moveTarget() {
            const maxX = window.innerWidth - 40;
            const maxY = window.innerHeight - 40;

            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
        }

        moveTarget();

        // Проверка столкновения
        function checkCollision() {
            const p = player.getBoundingClientRect();
            const t = target.getBoundingClientRect();

            if (
                p.left < t.right && p.right > t.left && p.top < t.bottom &&
                p.bottom > t.top      ) 
            {
                message.textContent = ++score;

                moveTarget();
            }
        }

        // Управление стрелками
        document.addEventListener("keydown", function (event) {

            if (event.key === "ArrowUp") {
                y -= step;
            }

            if (event.key === "ArrowDown") {
                y += step;
            }

            if (event.key === "ArrowLeft") {
                x -= step;
            }

            if (event.key === "ArrowRight") {
                x += step;
            }

            player.style.left = x + "px";
            player.style.top = y + "px";

            checkCollision();
        });

        // Дополнить функциональность ....
        //Количество попадании фиксируется в переменной и выводится на консоль! 
    </script>

    

</body>

</html>
