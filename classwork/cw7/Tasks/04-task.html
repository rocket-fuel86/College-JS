<body>
    <script>
        /*
        Задание:
        Перепишите функцию конструктор Rect. Вынесите методы из экземпляра в прототип.
        */

        function Rect(width, height) {
            this.width = width;
            this.height = height;
        }

        Rect.prototype.getArea = function () {
            return this.height * this.width;
        }

        Rect.prototype.getPerimeter = function () {
            return this.height * 2 + this.width * 2;
        }

        let rect1 = new Rect(100, 50);
        let rect2 = new Rect(25, 33);

        console.log("rect1 area " + rect1.getArea());
        console.log("rect1 perimeter " + rect1.getPerimeter());

        console.log("rect2 area " + rect2.getArea());
        console.log("rect2 perimeter " + rect2.getPerimeter());


        // Task 1

        function Circle(radius) {
            this.radius = radius;
        }

        Circle.prototype.getArea = function () {
            return Math.PI * this.radius * this.radius;
        }

        Circle.prototype.getCircumference = function () {
            return 2 * Math.PI * this.radius;
        }

        let circle = new Circle(10);

        console.log("Circle area:", circle.getArea());
        console.log("Circle circumference:", circle.getCircumference());


        // Task 2

        function User(name, age) {
            this.name = name;
            this.age = age;
        }

        User.prototype.sayHello = function () {
            console.log("Hello, my name is " + this.name);
        }

        User.prototype.isAdult = function () {
            return this.age >= 18;
        }

        let user1 = new User("Иван", 20);
        let user2 = new User("Анна", 16);

        user1.sayHello();
        console.log("Иван совершеннолетний:", user1.isAdult());

        user2.sayHello();
        console.log("Анна совершеннолетняя:", user2.isAdult());


        
        // Task 3

        function Triangle(a, b, c) {
            this.a = a;
            this.b = b;
            this.c = c;
        }

        Triangle.prototype.getPerimeter = function () {
            return this.a + this.b + this.c;
        }

        Triangle.prototype.getArea = function () {
            let p = (this.a + this.b + this.c) / 2;

            return Math.sqrt(p * (p - this.a) * (p - this.b) * (p - this.c));
        }

        let triangle = new Triangle(3, 4, 5);

        console.log("Triangle perimeter:", triangle.getPerimeter());
        console.log("Triangle area:", triangle.getArea());
    </script>
</body>
